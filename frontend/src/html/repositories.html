<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guild Halls - Subagent Guild</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7"></script>
    <style>
        /* Custom styles for the guild theme */
        .guild-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .agent-card {
            transition: all 0.3s ease;
            overflow: visible;
            position: relative;
        }
        
        .agent-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .team-btn.selected {
            @apply bg-green-500 text-white;
        }
        
        .compare-btn.selected {
            @apply bg-blue-500 text-white;
        }
        
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        
        .agent-card {
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }
        
        .agent-card > div {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        
        @media (max-width: 640px) {
            .agent-card {
                min-height: auto;
            }
            
            .agent-card .flex-wrap {
                flex-direction: column;
            }
            
            .agent-card .flex-wrap > * {
                flex: 1;
                min-width: 100%;
            }
        }
        
        .notification-enter {
            transform: translateX(100%);
        }
        
        .notification-enter-active {
            transform: translateX(0);
            transition: transform 0.3s ease-out;
        }
        
        .classification-badge {
            @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium;
        }
        
        .lifecycle-concept { @apply bg-purple-100 text-purple-800; }
        .lifecycle-design { @apply bg-blue-100 text-blue-800; }
        .lifecycle-development { @apply bg-green-100 text-green-800; }
        .lifecycle-testing { @apply bg-yellow-100 text-yellow-800; }
        .lifecycle-deployment { @apply bg-orange-100 text-orange-800; }
        .lifecycle-operations { @apply bg-red-100 text-red-800; }
        .lifecycle-general { @apply bg-gray-100 text-gray-800; }
        
        .tech-tag {
            @apply inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-indigo-100 text-indigo-800;
        }
        
        .loading-spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 2s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <h1 class="text-xl font-bold text-gray-900">🎭 Subagent Guild</h1>
                    </div>
                    <div class="hidden md:ml-6 md:flex md:space-x-8">
                        <a href="/agent_guild/" class="text-gray-900 hover:text-gray-700 px-3 py-2 text-sm font-medium">Home</a>
                        <a href="/agent_guild/agents.html" class="text-gray-900 hover:text-gray-700 px-3 py-2 text-sm font-medium">Explore</a>
                        <a href="/agent_guild/compare.html" class="text-gray-900 hover:text-gray-700 px-3 py-2 text-sm font-medium">Compare</a>
                        <a href="/agent_guild/repositories.html" class="text-gray-900 hover:text-gray-700 px-3 py-2 text-sm font-medium">Guild Halls</a>
                        <a href="/agent_guild/about.html" class="text-gray-900 hover:text-gray-700 px-3 py-2 text-sm font-medium">About</a>
                    </div>
                </div>
                <div class="flex items-center">
                    <!-- Selection Counter -->
                    <div class="relative">
                        <button onclick="window.location.href='/agent_guild/download.html'" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors flex items-center">
                            <span>📦</span>
                        </button>
                        <!-- Selection Badge -->
                        <span id="selection-badge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">
                        🏛️ Guild Halls
                    </h1>
                    <p class="mt-2 text-gray-600">
                        Explore the repositories that house our collection of AI development partners
                    </p>
                </div>
                
                <div class="mt-6 lg:mt-0">
                    <div class="text-center">
                        <div class="text-2xl font-bold text-blue-600" id="total-repos">0</div>
                        <div class="text-sm text-gray-500">Active Guild Halls</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Repository Grid -->
        <div id="repositories-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Repositories will be loaded here -->
        </div>
        
        <!-- Loading Spinner -->
        <div id="loading" class="text-center py-8" style="display: none;">
            <div class="loading-spinner mx-auto"></div>
            <p class="mt-2 text-gray-600">Loading guild halls...</p>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
